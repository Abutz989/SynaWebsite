<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <title data-i18n="meta.title"></title>
    <link rel="icon" type="image/png" href="LOGO_SIMBOL.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&amp;family=Heebo:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/myassets.css" />
    <link rel="stylesheet" href="assets/css/motion.css" />
    <script>document.documentElement.classList.add("js");</script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>

    <nav id="nav" class="site-nav" data-i18n-attr="aria-label:a11y.primaryNav">
      <div class="nav-shell">
        <a class="brand" href="#top" data-i18n-attr="aria-label:brand.name">
          <img class="brand-logo" src="LOGO_LIGHT.png" alt="" width="1080" height="607" />
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
          <span data-i18n="nav.menu"></span>
          <span class="nav-toggle-icon" aria-hidden="true"><i></i><i></i></span>
        </button>
        <div id="nav-menu" class="nav-menu">
          <ul class="nav-links">
            <li><a href="#intro" class="active" data-i18n="nav.whoWeAre"></a></li>
            <li><a href="#first" data-i18n="nav.industryChallenges"></a></li>
            <li><a href="#second" data-i18n="nav.ourMission"></a></li>
            <li><a href="#cta" data-i18n="nav.aboutUs"></a></li>
          </ul>
          <div class="lang-switch" role="group" data-i18n-attr="aria-label:footer.language">
            <button type="button" class="lang-btn" data-lang="he" aria-pressed="false" data-i18n="language.heShort"></button>
            <span aria-hidden="true"></span>
            <button type="button" class="lang-btn is-active" data-lang="en" aria-pressed="true" data-i18n="language.enShort"></button>
          </div>
        </div>
      </div>
    </nav>

    <header id="top" class="hero">
      <div class="hero-grid" aria-hidden="true"></div>
      <div class="page-shell hero-layout">
        <div class="hero-copy reveal is-visible">
          <p class="eyebrow"><span class="eyebrow-line"></span><span data-i18n="brand.name"></span></p>
          <h1 data-i18n-html="header.tagline"></h1>
          <p class="hero-sub" data-i18n-html="header.sub"></p>
          <a class="text-link" href="#intro">
            <span data-i18n="nav.whoWeAre"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          </a>
        </div>
        <div class="hero-media reveal is-visible">
          <div class="hero-image-wrap">
            <img src="images/robotouch.png" alt="" width="963" height="538" />
            <div class="hero-image-shade"></div>
          </div>
          <div class="orbit orbit-one"></div>
          <div class="orbit orbit-two"></div>
          <div class="media-index"><span data-i18n="sections.first"></span> <span></span> <span data-i18n="sections.last"></span></div>
        </div>
      </div>
      <div class="hero-rule" aria-hidden="true"></div>
    </header>

    <main id="main">
      <section id="intro" class="content-section section-light">
        <div class="page-shell editorial-grid">
          <header class="section-heading reveal">
            <div class="section-marker" aria-hidden="true"><span data-i18n="sections.first"></span><i></i></div>
            <h2 data-i18n="intro.title"></h2>
          </header>
          <div class="section-body lead-body reveal">
            <p data-i18n-html="intro.body"></p>
          </div>
        </div>
      </section>

      <section id="first" class="content-section section-dark">
        <div class="page-shell split-layout">
          <div class="section-media reveal">
            <div class="image-frame"><img src="images/busyWorkers.png" alt="" width="1024" height="1024" loading="lazy" /></div>
            <span class="frame-corner frame-corner-start" aria-hidden="true"></span>
            <span class="frame-corner frame-corner-end" aria-hidden="true"></span>
          </div>
          <div class="section-copy reveal">
            <header class="section-heading">
              <div class="section-marker" aria-hidden="true"><span data-i18n="sections.second"></span><i></i></div>
              <h2 data-i18n="first.title"></h2>
            </header>
            <div class="section-body">
              <p data-i18n-html="first.body"></p>
            </div>
          </div>
        </div>
      </section>

      <section id="second" class="content-section section-light">
        <div class="page-shell split-layout split-layout-reverse">
          <div class="section-copy reveal">
            <header class="section-heading">
              <div class="section-marker" aria-hidden="true"><span data-i18n="sections.third"></span><i></i></div>
              <h2 data-i18n="second.title"></h2>
            </header>
            <div class="section-body">
              <p data-i18n-html="second.body"></p>
            </div>
          </div>
          <div class="section-media section-media-wide reveal">
            <div class="image-frame"><img src="images/debrassing.png" alt="" width="1376" height="768" loading="lazy" /></div>
            <span class="frame-corner frame-corner-start" aria-hidden="true"></span>
            <span class="frame-corner frame-corner-end" aria-hidden="true"></span>
          </div>
        </div>
      </section>

      <section id="cta" class="about-section">
        <div class="page-shell about-grid">
          <header class="section-heading reveal">
            <div class="section-marker" aria-hidden="true"><span data-i18n="sections.last"></span><i></i></div>
            <h2 data-i18n="cta.title"></h2>
          </header>
          <div class="about-content reveal">
            <p data-i18n-html="cta.p1"></p>
            <p data-i18n-html="cta.p2"></p>
            <div class="button-row">
              <a class="button button-primary" data-i18n-attr="href:contact.mailtoHref">
                <span data-i18n="cta.letsTalk"></span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
              </a>
              <a target="_blank" rel="noopener noreferrer" class="button button-secondary" data-i18n="cta.letsMeet" data-i18n-attr="href:contact.meetingHref"></a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer id="footer" class="site-footer">
      <div class="page-shell">
        <div class="contact-panel reveal">
          <div class="contact-copy">
            <p class="eyebrow"><span class="eyebrow-line"></span><span data-i18n="brand.name"></span></p>
            <h2 data-i18n="footer.getInTouchTitle"></h2>
            <p data-i18n-html="footer.getInTouchBody"></p>
            <a class="button button-primary" data-i18n-attr="href:contact.mailtoHref">
              <span data-i18n="footer.letsTalk"></span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </a>
          </div>
          <address class="contact-details">
            <h3 data-i18n="footer.founderContact"></h3>
            <dl>
              <div><dt data-i18n="footer.location"></dt><dd data-i18n="contact.location"></dd></div>
              <div><dt data-i18n="footer.phone"></dt><dd><a dir="ltr" data-i18n="contact.phone" data-i18n-attr="href:contact.phoneHref"></a></dd></div>
              <div><dt data-i18n="footer.email"></dt><dd><a data-i18n="contact.email" data-i18n-attr="href:contact.emailHref"></a></dd></div>
              <div><dt data-i18n="footer.linkedin"></dt><dd><a target="_blank" rel="noopener noreferrer" data-i18n="contact.linkedinName" data-i18n-attr="href:contact.linkedinHref"></a></dd></div>
            </dl>
          </address>
        </div>
        <div class="footer-base">
          <a class="brand footer-brand" href="#top" data-i18n-attr="aria-label:brand.name"><img class="brand-logo" src="LOGO_LIGHT.png" alt="" width="1080" height="607" /></a>
          <p data-i18n-html="footer.copyright"></p>
          <div class="footer-language">
            <span data-i18n="footer.language"></span>
            <div class="lang-switch" role="group" data-i18n-attr="aria-label:footer.language">
              <button type="button" class="lang-btn" data-lang="he" aria-pressed="false" data-i18n="language.heShort"></button>
              <span aria-hidden="true"></span>
              <button type="button" class="lang-btn is-active" data-lang="en" aria-pressed="true" data-i18n="language.enShort"></button>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/i18n/en.js"></script>
    <script src="assets/i18n/he.js"></script>
    <script src="assets/js/i18n.js"></script>
  </body>
</html>
